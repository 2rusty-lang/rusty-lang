[workspace]
members = ["crates/capability-attr", "crates/sensitive-ifc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/2rusty-lang/rusty-lang"

# Mirrors securednetworkai's own workspace policy (see docs/adr/ADR-0004 and
# this repo's `[workspace.lints.clippy]`): deny by default, not opt-in per
# crate. `devtools code-generator --apply` additionally patches this into
# any crate found missing it (`ensure_mandatory_crate_settings`), so a
# crate added later without this block gets it automatically.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
