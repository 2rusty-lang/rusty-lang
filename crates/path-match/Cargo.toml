[package]
name = "rusty-path-match"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal-only syn::Path matching helpers shared by capability-attr and taint-check (trailing-segment / suffix / marker matching). Not published — no public-API guarantee, extracted purely to de-duplicate private helpers neither crate ever exposed."
publish = false

# Not `[lints] workspace = true` — Cargo forbids mixing `workspace = true`
# with any lint overrides in the same crate, same as every other crate in
# this workspace.
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lib]
name = "path_match"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
