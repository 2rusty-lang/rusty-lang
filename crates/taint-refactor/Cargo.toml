[package]
name = "rusty-taint-refactor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Given one taint violation found by rusty-taint-check's whole-crate scan, re-scans the entire crate for the same (label, sink) pattern and generates an applyable patch for every occurrence: a placeholder #[taint_sanitizer] plus a rewritten call site. The generated sanitizer is a naive fixed-string placeholder — review before trusting. See docs/adr/ADR-0005-generate-and-refactor.md."

# Not `[lints] workspace = true` — Cargo forbids mixing `workspace = true`
# with any lint overrides in the same crate, same as every other crate in
# this workspace.
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lib]
name = "taint_refactor"
path = "src/lib.rs"

[[bin]]
name = "taint-refactor"
path = "src/bin/taint-refactor.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
rusty-taint-check = { path = "../taint-check", version = "0.1.0" }
rusty-source-edit = { path = "../source-edit", version = "0.1.0" }
