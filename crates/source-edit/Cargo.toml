[package]
name = "rusty-source-edit"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Internal-only surgical source rewriting: replace exactly one syn::Item's byte span with a re-printed, mutated version of itself, leaving the rest of the file byte-identical. Shared by taint-generate and taint-refactor so neither silently reformats a whole file just to add one attribute or one call. Published only so those crates resolve from crates.io — no public-API/semver guarantee."

# Not `[lints] workspace = true` — Cargo forbids mixing `workspace = true`
# with any lint overrides in the same crate, same as every other crate in
# this workspace.
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lib]
name = "source_edit"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
# Dogfooding: this crate's own functions carry #[capability(...)], the
# same attribute `taint-generate` (source-edit's own consumer) writes for
# everyone else — see docs/adr/ADR-0002.
rusty-capability-attr = { path = "../capability-attr", version = "0.2.0" }
