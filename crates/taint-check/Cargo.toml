[package]
name = "rusty-taint-check"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phase 2 IFC for Rust: shared AST-inspection logic for #[taint_check(...)]'s label-propagation pass (tracking #[sensitive(label)] bindings through local assignments to a #[taint_sink(...)]), plus a standalone `taint-check` CLI that runs the same inspection outside the compiler for CI use with no proc-macro dependency. See docs/adr/ADR-0003 and rfcs/0003-taint-check.md."
license.workspace = true
repository.workspace = true
readme = "README.md"

# Not `[lints] workspace = true` — Cargo forbids mixing `workspace = true`
# with any lint overrides in the same crate (`capability-attr`'s and
# `sensitive-ifc`'s Cargo.toml hit this too), so this replicates the
# workspace's own `[workspace.lints.clippy] all = "deny"` and
# `[workspace.lints.rust] unexpected_cfgs` verbatim, then adds
# pedantic/nursery/cargo straight at "deny" for the same enable-from-birth
# reasoning those two crates already applied — see docs/adr/ADR-0003 and
# rfcs/0003-taint-check.md.
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lib]
name = "taint_check"
path = "src/lib.rs"

[[bin]]
name = "taint-check"
path = "src/bin/taint-check.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
# "span-locations" is what makes `Span::start()` return real line/column
# info when this crate's own `syn::parse_file` runs outside a real
# proc-macro invocation (the CLI path, `crate::cli`) — without it, fallback
# spans all report line 1, column 0. Harmless when compiled as part of a
# real proc-macro too (see `crates/taint-check-macros`): rustc's own spans
# are used there regardless.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Shared with capability-attr — see crates/path-match's crate docs. Used
# here to match a sink/sanitizer call by its trailing path segment, so
# `self::log_debug(...)` / `super::log_debug(...)` are recognized the same
# as a bare `log_debug(...)` call.
rusty-path-match = { path = "../path-match", version = "0.1.0" }
