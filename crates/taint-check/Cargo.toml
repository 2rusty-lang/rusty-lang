[package]
name = "rusty-taint-check"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phase 2 IFC for Rust: shared AST-inspection logic for #[taint_check(...)]'s label-propagation pass (tracking #[sensitive(label)] bindings through local assignments to a #[taint_sink(...)]), plus a standalone `taint-check` CLI that runs the same inspection outside the compiler for CI use, scanning any target file without requiring that target to depend on taint-check-macros. This crate itself depends on rusty-capability-attr to dogfood #[capability(...)] on its own functions. See docs/adr/ADR-0003 and rfcs/0003-taint-check.md."
license.workspace = true
repository.workspace = true
readme = "README.md"

# Not `[lints] workspace = true` — Cargo forbids mixing `workspace = true`
# with any lint overrides in the same crate (`capability-attr`'s and
# `sensitive-ifc`'s Cargo.toml hit this too), so this replicates the
# workspace's own `[workspace.lints.clippy] all = "deny"` and
# `[workspace.lints.rust] unexpected_cfgs` verbatim, then adds
# pedantic/nursery/cargo straight at "deny" for the same enable-from-birth
# reasoning those two crates already applied — see docs/adr/ADR-0003 and
# rfcs/0003-taint-check.md.
[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)'] }

[lib]
name = "taint_check"
path = "src/lib.rs"

[[bin]]
name = "taint-check"
path = "src/bin/taint-check.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
# "span-locations" is what makes `Span::start()` return real line/column
# info when this crate's own `syn::parse_file` runs outside a real
# proc-macro invocation (the CLI path, `crate::cli`) — without it, fallback
# spans all report line 1, column 0. Harmless when compiled as part of a
# real proc-macro too (see `crates/taint-check-macros`): rustc's own spans
# are used there regardless.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Shared with capability-attr — see crates/path-match's crate docs. Used
# here to match a sink/sanitizer call by its trailing path segment, so
# `self::log_debug(...)` / `super::log_debug(...)` are recognized the same
# as a bare `log_debug(...)` call.
rusty-path-match = { path = "../path-match", version = "0.1.0" }
# Dogfooding: this crate's own functions carry #[capability(...)] — see
# docs/adr/ADR-0002. Unrelated to the CLI's own "no proc-macro dependency
# required of the target being scanned" property, documented in this
# crate's own lib.rs docs.
rusty-capability-attr = { path = "../capability-attr", version = "0.1.3" }
# The capability vocabulary/inspector/ceiling-check used by `capability_derive`
# for RFC 0007's `--capabilities` declared-vs-derived check (RFC 0008
# extends RFC 0007's crate-level declaration with the same set-valued `io`
# ceiling `capability-attr`'s mod-level attribute uses).
rusty-capability-core = { path = "../capability-core", version = "0.1.0" }
# Parses `[package.metadata.rusty.capabilities]` out of the target crate's
# Cargo.toml (read-only) — see `crate::capability_manifest`.
toml = "1"
# Format-preserving Cargo.toml rewriting for `--capabilities --update` —
# unlike the plain `toml` crate above, this keeps comments/formatting/key
# order for everything `--update` doesn't itself change, the same
# principle `rusty-source-edit` applies to Rust source (RFC 0007's own
# reference-level explanation calls this out by name).
toml_edit = "0.22"
